<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>叶力展070327</title>
  <link rel="stylesheet" href="wallpaper.css">
  <link rel="stylesheet" href="widgets/countdown.css">
  <link rel="stylesheet" href="widgets/widget-themes.css">
  <link rel="stylesheet" href="widgets/widget-cascade.css">
  <link rel="stylesheet" href="widgets/album-switcher.css">
  <script src="widgets/countdown-core.js" defer></script>
  <script src="widgets/countdown.js" defer></script>
  <script src="widgets/widget-themes.js" defer></script>
  <script src="widgets/widget-cascade.js" defer></script>
  <script src="widgets/spectrum.js" defer></script>
  <script src="widgets/sparkles.js" defer></script>
  <script src="widgets/album-core.js" defer></script>
  <script src="widgets/album-switcher.js" defer></script>
  <script src="wallpaper.js" defer></script>
</head>
<body>
  <main id="wallpaper" aria-label="叶力展070327动态相册壁纸">
    <img id="artwork" src="assets/backgrounds/forest-clean.png" alt="暗绿花墙前的人像，四张独立相纸照片由相册层呈现" draggable="false">
    <div id="album-transition" aria-hidden="true"></div>
    <canvas id="atmosphere" aria-hidden="true"></canvas>
    <div id="album-layer" aria-label="原片相册，第一与第三张可切换"></div>
    <section id="countdown" aria-label="事件倒数日"></section>
    <p id="album-status" role="status" aria-live="polite"></p>
    <p id="load-error" role="alert" hidden>壁纸图片未能加载。请完整解压工程，保留 assets 文件夹。</p>
  </main>
</body>
</html>
